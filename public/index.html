<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calore 1 — Campaign Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="auth-screen"></div>

<div id="app-shell" style="display:none;">
<header class="topbar">
  <div class="brand">
    <span class="logo">
      <img src="/images/calore1logo.png" alt="Calore 1 Official Logo">
    </span>
    <div>
      <h1 id="league-name">Calore 1</h1>
      <div id="league-sub" class="muted"></div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <div id="season-switcher"></div>
    <span class="muted" id="whoami"></span>
    <button class="btn small" id="logout-btn">Log out</button>
    <button class="btn small" id="save-now-btn">Save now</button>
    <div class="save-state" id="save-state">Loading…</div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div id="credentials-banner"></div>

<main id="tab-content" class="tab-content"></main>
</div>

<template id="tpl-nothing">
  <p class="muted">Nothing here yet.</p>
</template>

<script src="app.js"></script>
</body>
</html>
